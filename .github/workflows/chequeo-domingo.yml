name: Chequeo del domingo (¿han llegado los guiones?)

# Cada domingo a las 22:30 (Madrid, invierno) mira si ChatGPT ha mandado los guiones de la semana que empieza el lunes
# y te manda un correo SOLO si falta alguno (si todo llegó, silencio). Solo cuenta ficheros: no usa ninguna IA ni gasta cuota de nada.
on:
  schedule:
    - cron: '30 21 * * 0'
  workflow_dispatch:
    inputs:
      lunes:
        description: 'Lunes de la semana a revisar (AAAA-MM-DD). Vacío = el próximo lunes'
        required: false

permissions:
  contents: read
  issues: write

jobs:
  chequeo:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contar los guiones que han llegado
        id: r
        run: python -m nutria.chequeo ${{ inputs.lunes && format('--lunes {0}', inputs.lunes) || '' }}
      - name: Avisar solo si falta algún guion
        env:
          TITULO: ${{ steps.r.outputs.titulo }}
          OK: ${{ steps.r.outputs.ok }}
        run: |
          if [ "$OK" = "si" ]; then echo "Todo ha llegado: no se manda correo."; exit 0; fi
          .github/aviso.sh "$TITULO" --body-file informe-chequeo.md
