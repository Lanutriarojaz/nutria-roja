name: Chequeo del domingo (¿han llegado los guiones?)

# Cada domingo a las 22:30 (Madrid, invierno) mira si ChatGPT ha mandado los guiones de la semana que empieza el lunes
# y te manda un correo con el resultado. Solo cuenta ficheros: no usa ninguna IA ni gasta cuota de nada.
on:
  schedule:
    - cron: '30 21 * * 0'
  workflow_dispatch:
    inputs:
      lunes:
        description: 'Lunes de la semana a revisar (AAAA-MM-DD). Vacío = el próximo lunes'
        required: false

permissions:
  contents: read
  issues: write

jobs:
  chequeo:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contar los guiones que han llegado
        id: r
        run: python -m nutria.chequeo ${{ inputs.lunes && format('--lunes {0}', inputs.lunes) || '' }}
      - name: Mandar el correo del resultado
        env:
          TITULO: ${{ steps.r.outputs.titulo }}
          OK: ${{ steps.r.outputs.ok }}
        run: |
          # el correo sale al abrir la incidencia; si todo está bien se cierra al momento para no acumular
          URL=$(.github/aviso.sh "$TITULO" --body-file informe-chequeo.md | tail -1)
          echo "$URL"
          if [ "$OK" = "si" ] && echo "$URL" | grep -q '^https://'; then
            gh issue close "$URL" -c "Todo ha llegado." || true
          fi
