name: Ver la cola de Buffer (solo lectura)

# Enseña qué hay programado en las dos cuentas de Buffer (La Nutria Roja y The Red Otter) sin abrir Buffer. No cambia nada.
on:
  workflow_dispatch:
    inputs:
      fechas:
        description: 'Días separados por espacios (AAAA-MM-DD). Vacío = hoy y los 6 siguientes'
        required: false

permissions:
  contents: read

jobs:
  cola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: La Nutria Roja
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python -m nutria.cola ${{ inputs.fechas }}
      - name: The Red Otter (inglés)
        if: always()
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY_EN }}
        run: python -m nutria.cola ${{ inputs.fechas }}
