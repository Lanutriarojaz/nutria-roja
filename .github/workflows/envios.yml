name: Vigilante de envios

# Media hora despues de cada publicacion mira si Buffer ha marcado algun post como fallido, lo reintenta
# y SOLO si sigue fallando manda un correo. Si todo salio, silencio.
on:
  schedule:
    - cron: '20 13 * * *'
    - cron: '40 18 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  envios:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_API_KEY_EN: ${{ secrets.BUFFER_API_KEY_EN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Buscar y reintentar envios fallidos
        id: r
        run: python -m nutria.envios
      - name: Correo solo si algo sigue sin publicarse
        if: steps.r.outputs.ok == 'no'
        run: .github/aviso.sh "${{ steps.r.outputs.titulo }}" --body-file informe-envios.md
      - name: Correo si el vigilante falla
        if: failure()
        run: .github/aviso.sh "El vigilante de envios ha fallado" "Detalles en ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
