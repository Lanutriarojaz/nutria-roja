name: Estado (cuotas y colas)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'        # cada domingo por la tarde, por si algo se acerca al límite

permissions:
  contents: read
  issues: write

jobs:
  estado:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Buffer y GitHub Pages
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python -m nutria.estado | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Claves de Buffer (castellano e inglés) siguen funcionando
        env:
          K_ES: ${{ secrets.BUFFER_API_KEY }}
          K_EN: ${{ secrets.BUFFER_API_KEY_EN }}
        run: |
          malas=""
          for par in "ES:$K_ES" "EN:$K_EN"; do n=${par%%:*}; k=${par#*:}; [ -z "$k" ] && continue
            r=$(BUFFER_API_KEY="$k" python -c "from nutria.publicar import canales; print(len(canales()))" 2>&1 | tail -1)
            echo "Buffer $n: $r redes" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$r" = "3" ] || malas="$malas $n"
          done
          if [ -n "$malas" ]; then
            .github/aviso.sh "🔑 Clave de Buffer caducada o sin redes:$malas" \
              "La clave de Buffer de$malas ya no ve sus 3 redes (caducada o desconectada). Hay que crear una nueva en publish.buffer.com/settings/api (caducidad 1 año) y pegarla en GitHub (BUFFER_API_KEY para castellano, BUFFER_API_KEY_EN para inglés)."
            exit 1
          fi
      - name: Modelos de Gemini disponibles (texto e imagen)
        env:
          K1: ${{ secrets.GEMINI_API_KEY }}
          K2: ${{ secrets.GEMINI_API_KEY_2 }}
          K3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: |
          for n in 1 2 3; do k=$(eval echo \$K$n); [ -z "$k" ] && continue
            echo "### Clave $n" | tee -a "$GITHUB_STEP_SUMMARY"
            curl -s "https://generativelanguage.googleapis.com/v1beta/models?pageSize=300&key=$k" \
              | python -c "import json,sys; [print('-', m['name'].split('/')[-1], m.get('supportedGenerationMethods')) for m in json.load(sys.stdin).get('models',[]) if any(w in m['name'] for w in ('image','imagen','veo'))]" | tee -a "$GITHUB_STEP_SUMMARY"
          done
