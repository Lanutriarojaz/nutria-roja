name: Tele-Dimensional (recibir ideas)

# El atajo del iPhone (ChatGPT) o la reserva (Claude) mandan aquí las ideas de la semana.
on:
  repository_dispatch:
    types: [ideas, guion, efemeride]
  workflow_dispatch:
    inputs:
      texto:
        description: 'Respuesta de la IA con las ideas (JSON)'
        required: true
      fuente:
        description: 'chatgpt o claude'
        default: 'chatgpt'

permissions:
  contents: write
  issues: write


jobs:
  guardar:
    runs-on: ubuntu-latest
    env:
      TEXTO: ${{ github.event.client_payload.texto || inputs.texto }}
      FUENTE: ${{ github.event.client_payload.fuente || inputs.fuente || 'chatgpt' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q edge-tts pillow requests numpy
      - name: Guardar las ideas
        run: |
          case "$FUENTE" in chatgpt|claude) ;; *) FUENTE=otra ;; esac
          if [ "${{ github.event.action }}" = "efemeride" ]; then
            printf '%s' "$TEXTO" | python -m nutria.encargos guardar
            git add nutria
          elif [ "${{ github.event.action }}" = "guion" ]; then
            printf '%s' "$TEXTO" | python -m tele.guiones guardar "$FUENTE"
          else
            printf '%s' "$TEXTO" | python -m tele.ideas guardar --fuente "$FUENTE"
          fi
          git add tele
          git config user.name nutria-bot && git config user.email bot@users.noreply.github.com
          git commit -qm "${{ github.event.action || 'ideas' }} de ChatGPT ($FUENTE)"
          # llegan varios a la vez desde el atajo: reintenta hasta subirlo, y si no lo consigue, que falle (y avise)
          for i in $(seq 1 8); do
            git pull -q --rebase && git push -q && exit 0
            git rebase --abort 2>/dev/null; sleep $((RANDOM % 12 + 4))
          done
          exit 1
      - name: Aviso si las ideas no valían
        if: failure()
        run: |
          gh issue create --title "💡 Las ideas de Tele-Dimensional no se han podido guardar" \
            --body "Ha llegado una respuesta que no se ha podido leer. Esa semana el guion tirará del sorteo. Detalles: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
