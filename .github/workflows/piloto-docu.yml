name: Piloto documentales (no publica)

on:
  push:
    branches: [piloto-docu]
    paths: ['docu/**', '.github/workflows/piloto-docu.yml']

permissions:
  contents: read

concurrency: piloto-docu

jobs:
  piloto:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar ffmpeg, espeak-ng y dependencias
        run: |
          for i in 1 2 3 4 5; do sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null && break; sleep 30; done
          pip install -q -r requirements.txt
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q kokoro soundfile || echo "Kokoro no se pudo instalar: se probarán solo las voces de Microsoft"
      - name: Montar el piloto
        run: python -m docu.piloto "$(cat docu/pilotos/ACTUAL)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piloto-docu
          path: |
            salida-docu/*.mp4
            salida-docu/informe.json
          retention-days: 14
