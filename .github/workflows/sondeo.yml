name: Sondeo de la API de Buffer (solo lectura)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python -m nutria.sondeo_buffer
