name: Tele-Dimensional (episodio diario)

on:
  schedule:
    - cron: '0 9 * * *'        # se prepara a las 10:00 de Madrid (11:00 en verano) y se publica a las 13:00
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Programar en Buffer'
        type: boolean
        default: false
      hora:
        description: 'Hora de publicación en Madrid (HH:MM)'
        required: false
        default: '13:00'

permissions:
  contents: write
  issues: write

concurrency: tirada          # nunca a la vez que la tirada semanal: las dos escriben en la rama media

jobs:
  episodio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      TZ: Europe/Madrid
      PAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar ffmpeg y dependencias
        run: |
          for i in 1 2 3 4 5; do sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && break; echo "apt falló (intento $i), reintento"; sleep 30; done
          ffmpeg -version | head -1
          pip install -q -r requirements.txt

      - name: Sorteo, guion, animación y control de calidad
        run: python -m tele.episodio --fecha "$(date +%F)" --registrar

      - name: Guardar el episodio para revisarlo (descargable 14 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episodio
          path: |
            salida-tele/*/video.mp4
            salida-tele/*/info.json
            salida-tele/*/ficha.md
          retention-days: 14

      - name: Subir el vídeo a la web pública (rama media → GitHub Pages)
        if: ${{ github.event_name == 'schedule' || inputs.publicar }}
        run: |
          HOY=$(date +%F)
          REMOTO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone -q --depth 1 -b media "$REMOTO" /tmp/media || mkdir -p /tmp/media
          cd /tmp/media && rm -rf .git
          limite=$(date -d '6 days ago' +%F)
          for f in td-20*.mp4; do [ -f "$f" ] || continue; d=${f#td-}; [ "${d%.mp4}" \< "$limite" ] && rm -f "$f"; done
          cp "$GITHUB_WORKSPACE/salida-tele/$HOY/video.mp4" "td-$HOY.mp4"
          [ -f index.html ] || echo "La Nutria Roja" > index.html
          git init -q -b media && git add -A && git -c user.name=nutria-bot -c user.email=bot@users.noreply.github.com commit -qm "Tele-Dimensional $HOY"
          git push -qf "$REMOTO" media
          bytes=$(stat -c %s "td-$HOY.mp4")
          for i in $(seq 1 40); do
            cab=$(curl -sI "$PAGES/td-$HOY.mp4" | tr -d '\r')
            largo=$(echo "$cab" | awk 'tolower($1)=="content-length:"{print $2}')
            if echo "$cab" | head -1 | grep -q 200 && { [ -z "$largo" ] || [ "$largo" = "$bytes" ]; }; then echo "Pages listo"; exit 0; fi
            sleep 15
          done
          echo "::error::GitHub Pages no sirve el vídeo"; exit 1

      - name: Programar en Buffer (TikTok, YouTube, Instagram)
        if: ${{ github.event_name == 'schedule' || inputs.publicar }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          MEDIA_BASE: ${{ env.PAGES }}
        run: python -m tele.publicar salida-tele/tirada.json --hora "${{ inputs.hora || '13:00' }}"

      - name: Apuntar el episodio (historial para no repetir + ficha)
        if: ${{ success() && (github.event_name == 'schedule' || inputs.publicar) }}
        run: |
          git add tele/historial.json tele/episodios
          git -c user.name=nutria-bot -c user.email=bot@users.noreply.github.com commit -qm "Tele-Dimensional $(date +%F)" || exit 0
          git pull -q --rebase && git push -q

      - name: Correo de aviso si algo ha fallado
        if: failure()
        run: |
          gh issue create --title "📺 Tele-Dimensional del $(date +%d/%m) no ha salido" \
            --body "El episodio de hoy no se ha publicado. Detalles: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
